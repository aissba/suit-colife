kind = "web"
previewPath = "/"
title = "Coolife × ALDI Landing Page"
version = "1.0.0"
id = "artifacts/coolife-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22098

[services.development]
run = "pnpm --filter @workspace/coolife-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coolife-landing", "run", "build" ]
publicDir = "artifacts/coolife-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22098"
BASE_PATH = "/"
